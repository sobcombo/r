function capitalizeWords(text){

return text
.toLowerCase()
.split(' ')
.filter(word => word.trim() !== "")
.map(word => word.charAt(0).toUpperCase() + word.slice(1))
.join(' ');

}

function getTodayDate(){

const today = new Date();

const day = String(today.getDate()).padStart(2,'0');
const month = String(today.getMonth()+1).padStart(2,'0');
const year = today.getFullYear();

return `${day}/${month}/${year}`;

}

function generateReport(){

const fname = capitalizeWords(document.getElementById("fname").value.trim());
const lname = capitalizeWords(document.getElementById("lname").value.trim());
const location = document.getElementById("location").value;

const output = document.getElementById("output");

if(fname === "" || lname === "" || location === ""){
    output.value = "";
    return;
}

const report = `*Location Awareness Report | ${getTodayDate()}*
*Location: ${location}*

${reports[location]}

*Notes*: N/A

*Reported By:*
${fname} ${lname}`;

output.value = report;

}

document.getElementById("fname").addEventListener("input", generateReport);
document.getElementById("lname").addEventListener("input", generateReport);
document.getElementById("location").addEventListener("change", generateReport);

document.getElementById("output").addEventListener("input", function(){

const fname = capitalizeWords(document.getElementById("fname").value.trim());
const lname = capitalizeWords(document.getElementById("lname").value.trim());

if(fname === "" || lname === ""){
    return;
}

const fixedName = `${fname} ${lname}`;

let text = this.value;

const reportedByRegex = /\*Reported By:\*\s*([\s\S]*)$/;

if(reportedByRegex.test(text)){

text = text.replace(
reportedByRegex,
`*Reported By:*\n${fixedName}`
);

this.value = text;

}

});

document.getElementById("copyBtn").addEventListener("click", async function(){

const output = document.getElementById("output");

if(output.value.trim() === ""){
    return;
}

try{

await navigator.clipboard.writeText(output.value);

}catch(err){

output.focus();
output.select();
output.setSelectionRange(0,999999);

document.execCommand("copy");

}

const btn = document.getElementById("copyBtn");

btn.innerText = "Copied Successfully";

btn.classList.add("copied");

setTimeout(()=>{

btn.innerText = "Copy Report";
btn.classList.remove("copied");

},1500);

});
